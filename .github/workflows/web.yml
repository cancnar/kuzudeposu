name: Web derleme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Eksik platform dosyalarını oluştur
        run: flutter create . --platforms=web --project-name kuzu_deposu --org com.kuzudeposu
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Web derle
        run: flutter build web --release --base-href /kuzudeposu/
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
