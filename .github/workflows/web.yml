name: Web derleme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Eksik platform dosyalarını oluştur
        run: flutter create . --platforms=web --project-name kuzu_deposu --org com.kuzudeposu
      - run: flutter pub get
      - name: Kod analizi (çıktıyı not olarak göster)
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analiz.txt 2>&1 || true
          echo "::notice title=analiz::$(head -c 6000 analiz.txt | sed ':a;N;$!ba;s/\n/ || /g')"
      - name: Testler (birim, bileşen, canlı Supabase)
        continue-on-error: true
        run: |
          flutter test --reporter expanded > test.txt 2>&1 || true
          echo "::notice title=test::$(grep -E -A3 'ADIM|TEST RAPORU|bilgi:|Some tests|All tests|\[E\]|Expected|Actual|taşma|Exception|Error|EXCEPTION|RenderFlex|Failed assertion|was thrown' test.txt | head -c 30000 | sed ':a;N;$!ba;s/\n/ || /g')"
      - name: Web derle
        run: |
          set -o pipefail
          flutter build web --release --base-href /kuzudeposu/ > derleme.txt 2>&1 || { echo "::error title=derleme::$(tail -c 30000 derleme.txt | sed ':a;N;$!ba;s/\n/ || /g')"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
